name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn --batch-mode verify

      - name: Check the example game
        run: java -jar target/noct.jar check examples/asylum.noct

      - name: Play through the example game
        run: |
          java -jar target/noct.jar play examples/asylum.noct < examples/asylum.walkthrough.txt | tee transcript.txt
          grep -q -- "-- THE END --" transcript.txt
